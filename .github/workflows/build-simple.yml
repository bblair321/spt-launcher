name: Build SPT Launcher (Simple)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Build Electron app
        run: npm run electron:build
        
      - name: Create portable package
        run: |
          cd out/make/zip/win32/x64
          zip -r "SPT-Launcher-$(date +%Y%m%d)-Windows-x64.zip" .
          
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: spt-launcher-portable
          path: out/make/zip/win32/x64/SPT-Launcher-*.zip
          retention-days: 30
