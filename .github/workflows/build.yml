name: Build and Release SPT Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Electron app
        run: npm run electron:build

      - name: Create release assets
        run: |
          # Find the build output and create appropriate package
          if [ -d "out/make/zip/win32/x64" ]; then
            echo "Found Windows build, creating Windows package..."
            cd out/make/zip/win32/x64
            zip -r "SPT-Launcher-${GITHUB_REF_NAME}-Windows-x64.zip" .
            cd ../../../..
            
            # Create Windows installer scripts
            echo '@echo off' > install.bat
            echo 'echo Installing SPT Launcher...' >> install.bat
            echo 'echo.' >> install.bat
            echo 'set /p INSTALL_PATH="Enter installation path (default: C:\Program Files\SPT Launcher): "' >> install.bat
            echo 'if "%INSTALL_PATH%"=="" set INSTALL_PATH=C:\Program Files\SPT Launcher' >> install.bat
            echo 'echo Installing to: %INSTALL_PATH%' >> install.bat
            echo 'echo.' >> install.bat
            echo 'REM Create directory' >> install.bat
            echo 'if not exist "%INSTALL_PATH%" mkdir "%INSTALL_PATH%"' >> install.bat
            echo 'REM Copy files' >> install.bat
            echo 'xcopy /E /I /Y . "%INSTALL_PATH%"' >> install.bat
            echo 'echo Installation completed!' >> install.bat
            echo 'pause' >> install.bat
            
            echo '@echo off' > uninstall.bat
            echo 'echo Uninstalling SPT Launcher...' >> uninstall.bat
            echo 'set /p INSTALL_PATH="Enter installation path: "' >> uninstall.bat
            echo 'if exist "%INSTALL_PATH%" rmdir /S /Q "%INSTALL_PATH%"' >> uninstall.bat
            echo 'echo Uninstallation completed!' >> uninstall.bat
            echo 'pause' >> uninstall.bat
            
            echo '[Setup]' > installer.iss
            echo 'AppName=SPT Launcher' >> installer.iss
            echo 'AppVersion=2.0.0' >> installer.iss
            echo 'DefaultDirName={pf}\SPT Launcher' >> installer.iss
            echo 'DefaultGroupName=SPT Launcher' >> installer.iss
            echo 'OutputBaseFilename=SPT-Launcher-Setup-2.0.0' >> installer.iss
            echo '' >> installer.iss
            echo '[Files]' >> installer.iss
            echo 'Source: "*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs' >> installer.iss
            echo '' >> installer.iss
            echo '[Icons]' >> installer.iss
            echo 'Name: "{group}\SPT Launcher"; Filename: "{app}\SPT Launcher.exe"' >> installer.iss
            echo 'Name: "{commondesktop}\SPT Launcher"; Filename: "{app}\SPT Launcher.exe"' >> installer.iss
            
          elif [ -d "out/make/zip/linux/x64" ]; then
            echo "Found Linux build, creating Linux package..."
            cd out/make/zip/linux/x64
            zip -r "SPT-Launcher-${GITHUB_REF_NAME}-Linux-x64.zip" .
            cd ../../../..
            
            # Create Linux installation script
            echo '#!/bin/bash' > install.sh
            echo 'echo "Installing SPT Launcher..."' >> install.sh
            echo 'read -p "Enter installation path (default: /opt/spt-launcher): " INSTALL_PATH' >> install.sh
            echo 'INSTALL_PATH=${INSTALL_PATH:-/opt/spt-launcher}' >> install.sh
            echo 'echo "Installing to: $INSTALL_PATH"' >> install.sh
            echo 'sudo mkdir -p "$INSTALL_PATH"' >> install.sh
            echo 'sudo cp -r . "$INSTALL_PATH/"' >> install.sh
            echo 'sudo chmod +x "$INSTALL_PATH/SPT Launcher"' >> install.sh
            echo 'echo "Installation completed!"' >> install.sh
            
            chmod +x install.sh
            
          else
            echo "No build output found in expected locations"
            ls -la out/make/
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            SPT-Launcher-*.zip
            install.bat
            uninstall.bat
            installer.iss
            install.sh
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SPT-Launcher-*.zip
            install.bat
            uninstall.bat
            installer.iss
            install.sh
          body: |
            ## SPT Launcher Release

            ### What's New
            - Built with GitHub Actions on Linux runners
            - Avoids Windows code signing issues
            - Multiple installation options

            ### Installation Options
            1. **Simple Installer** - Run `install.bat` as Administrator
            2. **Manual Installation** - Extract and run directly
            3. **Professional Installer** - Use `installer.iss` with Inno Setup

            ### System Requirements
            - Windows 10 or later
            - Administrator privileges for installation

            ### Files Included
            - `SPT-Launcher-*.zip` - Portable application
            - `install.bat` - Simple installer script
            - `uninstall.bat` - Uninstaller script
            - `installer.iss` - Inno Setup configuration
